# Babel extraction mapping for the gettext seam (docs/I18N.md). Used by `make i18n-extract`
# / `make i18n-update`; not read at runtime. Command names, JSON field names, rule IDs, and
# source citations are never wrapped in `_()`, so extraction never touches them regardless
# of which source files this mapping covers.
[python: ceqa_preflight/**.py]

[jinja2: ceqa_preflight/templates/**.j2]
encoding = utf-8
