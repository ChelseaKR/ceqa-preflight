# Extraction map for `pybabel extract -F babel.cfg ... src`. Patterns are relative to that
# input directory, which holds only the package itself: tests, scripts, and documentation
# are not user-facing product prose and must not put strings into a catalog a translator
# is asked to work through.
[python: **.py]
encoding = utf-8

[jinja2: **.j2]
encoding = utf-8
extensions = jinja2.ext.i18n
