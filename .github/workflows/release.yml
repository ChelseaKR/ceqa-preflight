name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing signed stable SemVer tag (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  authorize:
    uses: ChelseaKR/portfolio-standards/.github/workflows/release-authorize.yml@3692aa5270d673f91f8571b4fc0ce1c622bf67e5
    permissions:
      contents: read
    with:
      tag: ${{ inputs.tag }}

  build-and-attest:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.release-commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: false
      # --locked, not --frozen: see the note in ci.yml. --frozen installs a
      # lockfile that has drifted from pyproject.toml and exits 0, so it cannot
      # gate drift, and a release must not be built from a resolution nobody
      # reviewed.
      - run: uv sync --all-groups --locked
      - name: Require tag, package, and changelog versions to match
        env:
          TAG: ${{ needs.authorize.outputs.release-tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${VERSION}" = "${PACKAGE_VERSION}"
          # Anchored to a heading, not searched for anywhere in the file: `grep -Fq`
          # matched a bare mention of "## [1.2.0]" inside the Unreleased body just as
          # happily as a real released section, so the gate could pass on a changelog
          # that had never been cut. Same shape as tests/test_manifest.py's
          # `^##\s+\[?\d+\.\d+\.\d+`. The version is passed as an argument, not
          # interpolated into a pattern, so its dots cannot act as wildcards.
          python - "${VERSION}" <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          if not re.search(rf"^##\s+\[?{re.escape(version)}\]?", text, re.MULTILINE):
              raise SystemExit(f"CHANGELOG.md has no released section heading for {version}")
          PY
      - run: make verify
      - run: uv build
      - run: uv run --with cyclonedx-bom cyclonedx-py environment --output-file dist/sbom.cdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  publish-release:
    needs: [authorize, build-and-attest]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Recheck immutable tag object and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.authorize.outputs.release-tag }}
          TAG_OBJECT_SHA: ${{ needs.authorize.outputs.tag-object-sha }}
        run: |
          set -euo pipefail
          LIVE_TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha)"
          test "${LIVE_TAG_OBJECT}" = "${TAG_OBJECT_SHA}"
          gh release create "${TAG}" dist/* \
            --title "ceqa-preflight ${TAG}" --generate-notes
