version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    # One PR for the whole CodeQL action set: init, analyze, autobuild and
    # upload-sarif must always run the same version. Since CodeQL Action
    # 3.30.4 the non-init steps hard-error when they load a configuration
    # file written by a different version, so a half-applied bump breaks the
    # scan rather than merely warning.
    groups:
      codeql-action:
        patterns:
          - github/codeql-action*
    # `release.yml` pins a reusable workflow from ChelseaKR/portfolio-standards, a
    # *private* repository. Dependabot's repo-scoped credentials cannot read it. The
    # proxy logs `403 ... Either the repo doesn't exist, or Dependabot doesn't have
    # access to it`, the updater records `git_dependencies_not_reachable` for that one
    # dependency, and a single recorded error fails the entire run even though every
    # other action was checked and its pull requests were opened.
    #
    # That is what made the weekly `Dependabot Updates` job red. The pin arrived in
    # 671835f on 2026-07-31; the `github_actions` job was green on 2026-07-25 and has
    # failed on 2026-08-01, 08-08, 08-15 and 08-22, while the sibling `pip` job stayed
    # green throughout. The 08-22 run still opened both of its pull requests and still
    # exited non-zero.
    #
    # An `ignore` entry carrying only `dependency-name`, with no `versions` and no
    # `update-types`, means "every version". Dependabot drops such a dependency in
    # `Job#allowed_update?` before it builds an update checker, so the unreachable
    # fetch never happens, no error is recorded, and the run exits 0. This repository
    # has already demonstrated that: the targeted run on 2026-08-15 (job 1526359484,
    # scoped to the codeql-action group) still listed this workflow in its dependency
    # snapshot and still logged the 403, but never ran an update check against it, and
    # finished green.
    #
    # What this trades away: this single pin is no longer bumped automatically. It must
    # be bumped by hand. `tests/test_supply_chain.py` fails if this entry and the
    # `uses:` line in `release.yml` ever drift apart, in either direction, so neither a
    # rename nor a stale entry can quietly restore the weekly failure or quietly
    # suppress a dependency that could in fact have been updated.
    #
    # To restore automatic updates, give Dependabot a credential that can read
    # portfolio-standards: store a fine-grained PAT with read access to that repository
    # as a *Dependabot* secret, add a top-level `registries:` block of `type: git`
    # against https://github.com with `username: x-access-token` and that secret as the
    # password, reference the registry from this update entry, and delete this `ignore`
    # block. The organization-level "Grant Dependabot access to private repositories"
    # setting is not an option here: it exists only for organizations, and both
    # repositories are owned by a personal account.
    ignore:
      - dependency-name: ChelseaKR/portfolio-standards/.github/workflows/release-authorize.yml
