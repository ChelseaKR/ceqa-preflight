version: 2
updates:
  # `uv`, not `pip`. This project locks with uv and both workflows install with
  # `uv sync --all-groups --locked`, which fails when `uv.lock` has drifted from
  # `pyproject.toml`. The `pip` ecosystem edits `pyproject.toml` and does not know
  # `uv.lock` exists, so every Python dependency pull request Dependabot opened was
  # born red: PR #59 failed CI and Security on all three matrix platforms with
  # "The lockfile at `uv.lock` needs to be updated, but `--locked` was provided."
  # The gate was right; the lockfile really was stale. Only a manual relock could
  # land such a PR.
  #
  # Dependabot's `uv` ecosystem understands `pyproject.toml` and `uv.lock` together
  # and updates both in one pull request. It is a documented `package-ecosystem`
  # value and is generally available for version updates (GitHub Changelog,
  # 2025-03-13) and for security updates (2025-12-16).
  #
  # `tests/test_supply_chain.py` fails if this is ever changed back to `pip` while
  # a committed `uv.lock` is what the workflows install from.
  - package-ecosystem: uv
    directory: "/"
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    # One PR for the whole CodeQL action set: init, analyze, autobuild and
    # upload-sarif must always run the same version. Since CodeQL Action
    # 3.30.4 the non-init steps hard-error when they load a configuration
    # file written by a different version, so a half-applied bump breaks the
    # scan rather than merely warning.
    groups:
      codeql-action:
        patterns:
          - github/codeql-action*
    # There is deliberately no `ignore` block here any more, and the reason is worth
    # keeping because the entry that used to sit here looked like protection.
    #
    # `release.yml` pinned its reusable authorize workflow to ChelseaKR/portfolio-standards,
    # a *private* repository. Dependabot's repo-scoped credentials cannot read one: the
    # proxy logs `403 ... Either the repo doesn't exist, or Dependabot doesn't have access
    # to it`, the updater records `git_dependencies_not_reachable` for that one dependency,
    # and a single recorded error fails the whole run even though every other action was
    # checked and its pull requests were opened. That is what made the weekly
    # `Dependabot Updates` job red on 2026-08-01, 08-08, 08-15 and 08-22 while the sibling
    # Python job stayed green. An `ignore` entry naming that dependency made the run exit 0
    # by dropping it before any update check, at the cost of never bumping the pin.
    #
    # The pin now points at ChelseaKR/.github, which is *public*, so Dependabot can read it
    # and automatic updates are restored. Suppressing a readable dependency would hide
    # updates that can in fact be made, behind a comment whose stated reason had stopped
    # being true. `tests/test_supply_chain.py` fails on an `ignore` entry that names no
    # pinned workflow, so a stale one cannot come back unnoticed.
